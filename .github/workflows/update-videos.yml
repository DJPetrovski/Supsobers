name: Update videos

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours, so a new upload shows up on the site within a couple of hours
    - cron: "*/15 17-23 * * 5"   # Fridays from 11am Mountain on: check every 15 minutes so the new upload lands fast
    - cron: "*/15 0-13 * * 6"    # ...and through the late-evening hours into Saturday morning
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos
        run: python3 scripts/fetch_videos.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Mark which videos were live streams
        continue-on-error: true
        run: python3 scripts/classify_live.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/featured.json data/live.json
          git diff --cached --quiet || (git commit -m "Update videos" && git push)
