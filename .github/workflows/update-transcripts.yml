name: Update transcripts

on:
  schedule:
    - cron: "41 */6 * * *"   # four times a day; it quietly does nothing until the YouTube secrets are added
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull captions for videos that do not have a transcript yet
        run: python3 scripts/sync_transcripts.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh the search-by-meaning index (only new text is processed)
        run: |
          npm ci --no-audit --no-fund
          node scripts/build_embeddings.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "Update transcripts" && git pull --rebase -q && git push)
