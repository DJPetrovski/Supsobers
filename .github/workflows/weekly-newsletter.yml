name: Friday newsletter

on:
  schedule:
    - cron: "0 21 * * 5"    # 3:00 pm Mountain in summer time
    - cron: "0 22 * * 5"    # 3:00 pm Mountain in winter time (the script only acts on Friday from 3 pm to midnight there, and once a day)
  workflow_dispatch:         # run by hand from the Actions tab: builds a DRAFT in Kit so you can check it

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and send the digest
        run: python3 scripts/build_digest.py
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          # scheduled runs send for real (3:33 pm Denver); set a repo variable DIGEST_PAUSE=true to pause that
          DIGEST_SEND: ${{ github.event_name == 'schedule' && vars.DIGEST_PAUSE != 'true' && 'true' || '' }}
      - name: Remember that this week went out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a draft run (run by hand) never writes this file, and git add on a missing file stops with exit code 128
          [ -f data/digest-last.txt ] && git add data/digest-last.txt || true
          git diff --cached --quiet || (git commit -m "Newsletter sent" && git pull -q --rebase origin main && git push)
